[package]
name = "kanban"
version = "0.0.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kanban_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["fs"] }
sqlx = { version = "0.9", default-features = false, features = ["macros", "derive", "migrate", "chrono", "uuid", "tls-rustls-ring-webpki", "runtime-tokio", "sqlite"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.rust]
warnings = "deny"

[lints.clippy]
# Idiomatic Paths
absolute_paths = "warn"
enum_glob_use = "warn"
wildcard_imports = "warn"

# Errors as Values / hygiene
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
panic_in_result_fn = "warn"
todo = "warn"
unimplemented = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"

# Make Illegal States Unrepresentable
fallible_impl_from = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"

# Functional Core, Imperative Shell
print_stderr = "warn"
print_stdout = "warn"

# Low-churn nursery lints
debug_assert_with_mut_call = "warn"
needless_collect = "warn"
redundant_clone = "warn"

# Low-churn pedantic lints
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "warn"
