[workspace]
members = ["crates/app", "crates/domain", "crates/macros", "crates/store-sqlite"]

[workspace.package]
version = "0.0.1"
authors = ["you"]
edition = "2024"
publish = false

[workspace.dependencies]
app = { path = "crates/app" }
domain = { path = "crates/domain" }
macros = { path = "crates/macros" }
store-sqlite = { path = "crates/store-sqlite" }

jiff = "1"
proc-macro2 = "1"
quote = "1"
serde = "1"
serde_json = "1"
sqlx = { version = "0.9", default-features = false }
syn = "3"
thiserror = "2"
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = "1"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
# Idiomatic Paths
absolute_paths = "warn"
enum_glob_use = "warn"
wildcard_imports = "warn"

# Errors as Values / hygiene
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
panic_in_result_fn = "warn"
todo = "warn"
unimplemented = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"

# Make Illegal States Unrepresentable
fallible_impl_from = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"

# Functional Core, Imperative Shell
print_stderr = "warn"
print_stdout = "warn"

# Low-churn nursery lints
debug_assert_with_mut_call = "warn"
needless_collect = "warn"
redundant_clone = "warn"

# Low-churn pedantic lints
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "warn"

[package]
name = "kanban"
description = "A Tauri App"
version.workspace = true
authors.workspace = true
edition.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kanban_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app.workspace = true
domain.workspace = true
jiff = { workspace = true, features = ["serde"] }
macros.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
specta = { version = "=2.0.0-rc.28", features = ["derive", "function", "uuid"] }
specta-typescript = "0.0.15"
sqlx = { workspace = true, features = [
  "macros",
  "derive",
  "migrate",
  "uuid",
  "tls-rustls-ring-webpki",
  "runtime-tokio",
  "sqlite",
] }
store-sqlite.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-specta = { version = "=2.0.0-rc.29", features = ["typescript"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v7", "serde"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints]
workspace = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { workspace = true, features = ["macros", "rt"] }
